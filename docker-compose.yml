services:
  postgres:
    image: postgres:17
    container_name: patternrun-postgres
    environment:
      POSTGRES_DB: patternrun
      POSTGRES_USER: patternrun
      POSTGRES_PASSWORD: patternrun
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patternrun -d patternrun"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: