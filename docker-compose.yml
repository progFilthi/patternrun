services:
  postgres:
    image: postgres:18-alpine
    container_name: patternrun-postgres
    environment:
      POSTGRES_DB: patternrun
      POSTGRES_USER: patternrun
      POSTGRES_PASSWORD: patternrun
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 puts PGDATA in a versioned subdirectory; mount the parent.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patternrun -d patternrun"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: