server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: patternrun-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/patternrun}
    username: ${DB_USERNAME:patternrun}
    password: ${DB_PASSWORD:patternrun}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          # Hibernate 7 ships a Jackson 3 mapper; "jackson" now means Jackson 2.
          json_format_mapper: jackson3
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

patternrun:
  seed:
    enabled: ${PATTERN_SEED_ENABLED:true}
  execution:
    # Off by default, and that default is the security model. Running a learner's code needs a
    # runtime that is genuinely isolated from this process; without one configured, the honest
    # answer is that Run is unavailable. There is deliberately no in-process fallback: "the
    # sandbox is missing so let us just run it here" is the one behaviour this must never have.
    #
    # To turn it on: `docker compose --profile executor up -d executor` then run the API with
    # PATTERN_RUNNER_ENABLED=true. See backend/executor/README.md.
    enabled: ${PATTERN_RUNNER_ENABLED:false}
    docker:
      image: ${PATTERN_RUNNER_IMAGE:patternrun-executor:py3}
      total-timeout: 2s
      wall-clock-timeout: 20s
      memory: 256m
      cpus: "0.5"
      pids: 32
      max-concurrent: 4
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    # The web app proxies /api/v1 through its own origin, so from the browser's point of view
    # the session cookie is always same-site. That is what lets it stay SameSite=Lax, which is
    # what makes CSRF protection a framework default rather than code we have to get right.
    same-origin-frontend: ${SAME_ORIGIN_FRONTEND:true}

logging:
  level:
    org.flywaydb: INFO